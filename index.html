<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свадьба Александра и Марии</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  color: #333;
  background: #fff;
}
h1, h2 {
  font-family: 'Cormorant Garamond', serif;
}
/* HERO PREMIUM */
.hero {
  height: 100vh;
  background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
              url('https://images.unsplash.com/photo-1522673607200-164d1b6ce486') center/cover;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  overflow: hidden;
}
.hero h1 {
  font-size: 64px;
  margin: 0;
  letter-spacing: 2px;
  opacity: 0;
  transform: translateY(30px);
  animation: fadeUp 1.5s ease forwards;
}
.hero p {
  font-size: 20px;
  margin-top: 15px;
  opacity: 0;
  animation: fadeUp 1.5s ease forwards;
  animation-delay: 0.5s;
}
.subtitle {
  margin-top: 10px;
  font-size: 14px;
  letter-spacing: 3px;
  opacity: 0.8;
}
/* COUNTDOWN PREMIUM */
.countdown {
  display: flex;
  gap: 15px;
  margin-top: 40px;
}
.countdown div {
  min-width: 70px;
  padding: 15px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  animation: fadeUp 1.5s ease forwards;
}
.countdown span {
  display: block;
  font-size: 28px;
  font-weight: 600;
}
/* SCROLL DOWN */
.scroll {
  position: absolute;
  bottom: 20px;
  font-size: 12px;
  letter-spacing: 2px;
  opacity: 0.7;
  animation: bounce 2s infinite;
}
/* SECTIONS */
.section {
  padding: 100px 20px;
  max-width: 800px;
  margin: auto;
  text-align: center;
}
.fade {
  opacity: 0;
  transform: translateY(30px);
  transition: 1.2s ease;
}
.fade.visible {
  opacity: 1;
  transform: translateY(0);
}
/* ANIMATIONS */
@keyframes fadeUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(8px); }
}
@media (max-width: 600px) {
  .hero h1 {
    font-size: 36px;
  }
  .countdown {
    flex-wrap: wrap;
    justify-content: center;
  }
}
</style>
</head>
<body>
<div class="hero">
  <h1>Александр & Мария</h1>
  <p>5–6 сентября 2026</p>
  <div class="subtitle">МЫ ЖДЁМ ВАС</div>
  <div class="countdown">
    <div><span id="days">0</span>дней</div>
    <div><span id="hours">0</span>часов</div>
    <div><span id="minutes">0</span>минут</div>
    <div><span id="seconds">0</span>секунд</div>
  </div>
  <div class="scroll">↓ листайте вниз ↓</div>
</div>
<div class="section fade">
  <h2>Церемония</h2>
  <p>
    5 сентября 2026 в 20:20<br>
    Дворец бракосочетания №1<br>
    Английская набережная
  </p>
</div>
<div class="section fade">
  <h2>Празднование</h2>
  <p>
    6 сентября 2026<br>
    Площадка «Дача у Озера"
  </p>
</div>
<script>
// COUNTDOWN
const weddingDate = new Date("2026-09-05T20:20:00").getTime();
setInterval(() => {
  const now = new Date().getTime();
  const diff = weddingDate - now;
  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);
  document.getElementById("days").innerText = days;
  document.getElementById("hours").innerText = hours;
  document.getElementById("minutes").innerText = minutes;
  document.getElementById("seconds").innerText = seconds;
}, 1000);
// SCROLL ANIMATION
const faders = document.querySelectorAll('.fade');
window.addEventListener('scroll', () => {
  faders.forEach(el => {
    const top = el.getBoundingClientRect().top;
    if (top < window.innerHeight - 100) {
      el.classList.add('visible');
    }
  });
});
</script>
</body>
</html>
