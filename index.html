<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Свадьба Александра и Марии</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
<style>
html { scroll-behavior: smooth; }
body { margin:0; font-family:Montserrat; color:#4b4b4b; overflow-x:hidden; }
h1,h2 { font-family:'Cormorant Garamond'; }
nav {
 position:fixed; top:0; width:100%;
 background:rgba(255,255,255,0.7);
 backdrop-filter: blur(10px);
 display:flex; justify-content:center; gap:20px;
 padding:12px; z-index:1000;
}
nav a { color:#6b5b57; text-decoration:none; }
/* HERO */
.hero {
 height:100vh;
 background:linear-gradient(rgba(255,255,255,0.6), rgba(255,255,255,0.85)),
 url('https://images.unsplash.com/photo-1519741497674-611481863552');
 background-size:cover;
 background-position:center;
 display:flex; flex-direction:column; justify-content:center; align-items:center;
 text-align:center;
 position:relative;
}
/* ДЕКОР */
.decor-left, .decor-right {
 position:absolute;
 top:0;
 width:180px;
 opacity:0.25;
 pointer-events:none;
}
.decor-left { left:0; }
.decor-right { right:0; transform: scaleX(-1); }
/* ИМЕНА ПО БУКВАМ */
.name span {
 opacity:0;
 display:inline-block;
 transform:translateY(20px);
 animation:letter 0.6s forwards;
}
@keyframes letter {
 to { opacity:1; transform:translateY(0); }
}
.hero h1 {
 font-size:60px;
 color:#5c4a45;
}
.hero p { color:#7a6a64; }
.section {
 padding:100px 20px;
 max-width:900px;
 margin:auto;
 text-align:center;
}
.card {
 background:#fff;
 border-radius:20px;
 padding:30px;
 box-shadow:0 15px 40px rgba(0,0,0,0.06);
 transform:translateY(40px);
 opacity:0;
 transition:1s;
}
.card.visible {
 transform:translateY(0);
 opacity:1;
}
/* ПЛАВНЫЙ ПАРАЛЛАКС */
.parallax {
 will-change: transform;
 transition: transform 0.2s linear;
}
input,select,textarea {
 padding:12px; width:100%; border-radius:10px; border:1px solid #ddd;
}
button {
 padding:14px; background:#c6a9a3; color:white; border:none; border-radius:10px;
}
</style>
</head>
<body>
<audio id="music" loop>
<source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b1c6c.mp3" type="audio/mpeg">
</audio>
<nav>
<a href="#about">О нас</a>
<a href="#form">Ответить</a>
</nav>
<div class="hero parallax" id="hero">
<img class="decor-left" src="https://pngimg.com/uploads/flower/flower_PNG102.png">
<img class="decor-right" src="https://pngimg.com/uploads/flower/flower_PNG102.png">
<h1 class="name" id="names"></h1>
<p>5–6 сентября 2026</p>
</div>
<div class="section">
<div class="card">
<h2>Дорогие гости!</h2>
<p>С огромной радостью приглашаем вас разделить с нами этот особенный день.</p>
</div>
</div>
<div class="section">
<div class="card">
<h2>Церемония</h2>
<p>5 сентября 2026 в 20:20<br>Дворец бракосочетания №1</p>
</div>
</div>
<div class="section" id="form">
<div class="card">
<h2>Анкета</h2>
<form onsubmit="event.preventDefault(); alert('Спасибо!');">
<input placeholder="Ваше имя">
<select><option>Приду</option><option>Не смогу</option></select>
<button>Отправить</button>
</form>
</div>
</div>
<script>
// ИМЕНА ПО БУКВАМ
const text = "Александр & Мария";
const container = document.getElementById('names');
text.split('').forEach((letter, i) => {
 const span = document.createElement('span');
 span.textContent = letter;
 span.style.animationDelay = i * 0.05 + 's';
 container.appendChild(span);
});
// МУЗЫКА (по клику — иначе браузеры блокируют)
document.body.addEventListener('click', () => {
 document.getElementById('music').play();
}, { once: true });
// ПАРАЛЛАКС
window.addEventListener('scroll', () => {
 const scrolled = window.scrollY;
 document.getElementById('hero').style.transform = `translateY(${scrolled * 0.2}px)`;
});
// ПОЯВЛЕНИЕ КАРТОЧЕК
const cards = document.querySelectorAll('.card');
window.addEventListener('scroll', () => {
 cards.forEach(el => {
   const top = el.getBoundingClientRect().top;
   if(top < window.innerHeight - 100) {
     el.classList.add('visible');
   }
 });
});
</script>
</body>
</html>
